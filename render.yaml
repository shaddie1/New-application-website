services:
  - type: web
    name: onyxhawk-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm turbo run build --filter=@onyxhawk/api...
    startCommand: pnpm --filter @onyxhawk/api start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      # Set only after Africa's Talking approves the alphanumeric sender ID
      # (e.g. ONYXHAWK). Unset → messages use AT's shared default sender.
      - key: SMS_SENDER_ID
        sync: false
      - key: MPESA_BASE_URL
        value: https://sandbox.safaricom.co.ke
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      # Object storage for booking photos, documents and website-job photos.
      # R2_PUBLIC_URL must be a custom subdomain connected to the bucket, not
      # the rate-limited r2.dev address (see DEPLOY.md, "Website jobs").
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # onyxhawk-web's deploy hook. Publishing a website job POSTs here so the
      # static site rebuilds with the job in it. Unset → no rebuild.
      - key: WEB_DEPLOY_HOOK_URL
        sync: false

  # The admin app is a Next.js static export (see apps/admin/next.config.mjs):
  # `next build` emits plain HTML/JS into out/, so there is no server to start —
  # we serve those files. `next start` would fail here.
  - type: web
    name: onyxhawk-admin
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm turbo run build --filter=@onyxhawk/admin...
    startCommand: pnpm --filter @onyxhawk/admin start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false

  # Customer-facing site — same static-export pattern as the admin.
  - type: web
    name: onyxhawk-web
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm turbo run build --filter=@onyxhawk/web...
    startCommand: pnpm --filter @onyxhawk/web start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # The build fetches published website jobs from the API. With this set, a
      # failed fetch fails the build, so Render keeps the previous site live
      # instead of shipping one with an empty "Our work" section.
      - key: REQUIRE_WEBSITE_JOBS
        value: "1"
